name: Deploy

on:
  push:
    branches:
      - development

env:
  BRANCH: development
  DEPLOY_PATH: /home/web-portfolio/frontend
  WEB_ROOT: /var/www/portfolio

jobs:
  deploy:
    runs-on: self-hosted
    if: github.repository == 'Aaron4554/web-portfolio'
    steps:
      - name: Build and deploy
        run: |
          cd ${{ env.DEPLOY_PATH}}
          OLD=$(git rev-parse HEAD)
          git pull origin ${{ env.BRANCH }}
          if ! git diff --quiet $OLD HEAD -- package-lock.json; then
            npm ci --prefer-offline --no-audit --no-fund
          fi
          npm run build
          sudo rsync -a --delete dist/ ${{ env.WEB_ROOT }}/
          sudo restorecon -Rv ${{ env.WEB_ROOT }}
