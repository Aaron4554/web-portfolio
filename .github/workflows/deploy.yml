name: Deploy

on:
  push:
    branches:
      - learning

env:
  BRANCH: learning
  DEPLOY_PATH: /home/web-portfolio

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Pull latest
        run: |
          cd ${{ env.DEPLOY_PATH}}
          git pull origin ${{ env.BRANCH }}
          npm install
          pkill -f 'vite' || true
          nohup npm run dev -- --host > /tmp/vite.log 2>&1 &
          NPM_ID=$(pgrep -f "vite")
          disown $NPM_ID
