name: Deploy

on:
  push:
    branches:
      - development

env:
  BRANCH: development
  DEPLOY_PATH: /home/web-portfolio/frontend

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Pull latest
        run: |
          cd ${{ env.DEPLOY_PATH}}
          OLD=$(git rev-parse HEAD)
          git pull origin ${{ env.BRANCH }}
          if ! git diff --quiet $OLD HEAD -- package-lock.json; then
            npm ci --prefer-offline --no-audit --no-fund
          fi
          npm run dev -- --host
