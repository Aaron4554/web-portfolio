name: Deploy

on:
  push:
    branches:
      - development

env:
  BRANCH: development
  DEPLOY_PATH: /home/web-portfolio/frontend

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Pull latest
        run: |
          cd ${{ env.DEPLOY_PATH}}
          git pull origin ${{ env.BRANCH }}
          npm install
          npm run dev -- --host
